<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dblp-bib</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23245b9a'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3Eb%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <a class="logo" href="#search">dblp<span>·bib</span></a>
  <form id="searchform" class="search" autocomplete="off">
    <input id="q" type="search" placeholder="Search dblp: words, &quot;phrases&quot;, author:name, venue:ITP, year:2019, -exclude   ( / )" aria-label="Search">
    <button type="submit">Search</button>
  </form>
  <nav>
    <a href="#search" data-nav="search">Search</a>
    <a href="#bib" data-nav="bib">Bibliography <span id="bibcount" class="count">0</span></a>
    <a href="#options" data-nav="options">Options</a>
    <a href="#data" data-nav="data">Data</a>
  </nav>
</header>
<div id="banner" class="banner hidden"></div>
<main id="view"></main>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
